name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: 语法检查
        run: |
          for f in src/*.js tools/*.js tools/*.cjs tests/*.cjs; do
            node --check "$f"
          done
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 元信息与分发检查
        run: npm run check:store
      - name: 注音、外部网站、纠音、编辑与缓存回归
        run: npm test
      - name: 接口链路（私有 fixture 缺失则跳过）
        run: node tools/test-api-romaji.js
      - name: RNP / LyricBar 逐字兼容
        run: |
          node tools/test-rnp-dom.js
          node tools/test-rnp-dom.js slide
          node tools/test-rnp-dom.js float noruby
          node tools/test-rnp-dom.js slide noruby
          node tools/test-rnp-dom.js lyricbar
          node tools/test-rnp-dom.js lyricbar noruby
      - name: 打包冒烟
        run: |
          node tools/pack.js
          unzip -t builds/jp-furigana.plugin

      - uses: actions/upload-artifact@v4
        with:
          name: jp-furigana-plugin
          path: builds/jp-furigana.plugin
          if-no-files-found: error

  windows-save:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Windows 原子保存
        run: node tests/cache-write.test.cjs

  release:
    needs: [test, windows-save]
    # Preserve upstream main -> v<manifest.version>. Fork pushes only run checks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Leleawa/jp-furigana'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: jp-furigana-plugin
          path: release-artifact
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src/manifest.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skip."
            exit 0
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          if [ -n "$prev" ] && git rev-parse "$prev" >/dev/null 2>&1; then
            git log --no-merges --pretty='- %s' "$prev..HEAD" > "$notes"
          else
            git log --no-merges -10 --pretty='- %s' > "$notes"
          fi
          gh release create "$tag" release-artifact/jp-furigana.plugin --title "$version" --notes-file "$notes"
